<?xml version="1.0" encoding="UTF-8"?>
<svg width="920" height="585" viewBox="40 55 920 585" role="img" aria-labelledby="graphic-title graphic-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="graphic-title">地球观测与地理空间 AI 动态流程</title><desc id="graphic-desc">卫星和无人机对地球上的城市进行扫描，影像依次经过重建、信息处理、人工智能网络，生成地理空间分析结果。</desc>
<style><![CDATA[
  text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
  .soft-float { animation: geoFloat 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .soft-float.alt { animation-delay: -2.7s; animation-duration: 7.4s; }
  .soft-float.slow { animation-delay: -1.1s; animation-duration: 9s; }
  .orbital { transform-origin: 345px 348px; animation: geoOrbit 55s linear infinite; }
  .pulse { animation: geoPulse 3.8s ease-in-out infinite; }
  .twinkle { animation: geoTwinkle 4s ease-in-out infinite; }
  .beam { animation: geoBeam 5.2s ease-in-out infinite; }
  .signal { stroke-dasharray: 5 10; animation: geoDash 10s linear infinite; }
  .point { animation: geoPoint 3s ease-in-out infinite; }
  .point.p2 { animation-delay: -.9s; }
  .point.p3 { animation-delay: -1.7s; }
  .point.p4 { animation-delay: -2.4s; }
  .scan { animation: geoScan 4s ease-in-out infinite; }
  .neuron { animation: geoNeuron 2.5s ease-in-out infinite; }
  .neuron.n2 { animation-delay: -.6s; }
  .neuron.n3 { animation-delay: -1.25s; }
  .neuron.n4 { animation-delay: -1.8s; }
  .scene-label { font-size: 22px; font-weight: 600; fill: #e5f6fa; letter-spacing: 0; }
  .hud-panel { fill: #0d2230; fill-opacity: .94; stroke: #426675; stroke-width: 1; }
  @keyframes geoFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }
  @keyframes geoOrbit { to { transform: rotate(360deg); } }
  @keyframes geoPulse { 0%, 100% { opacity: .38; } 50% { opacity: 1; } }
  @keyframes geoBeam { 0%, 100% { opacity: .10; } 35%, 65% { opacity: .55; } }
  @keyframes geoTwinkle { 0%, 100% { opacity: .20; } 50% { opacity: .95; } }
  @keyframes geoDash { to { stroke-dashoffset: -150; } }
  @keyframes geoPoint { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes geoScan { 0% { transform: translateY(0); opacity: .2; } 50% { opacity: .85; } 100% { transform: translateY(67px); opacity: .1; } }
  @keyframes geoNeuron { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .soft-float, .orbital, .pulse, .twinkle, .beam, .signal, .point, .scan, .neuron { animation: none !important; }
  }
]]></style>
