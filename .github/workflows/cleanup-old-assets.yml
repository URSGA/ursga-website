# Generated by scripts/build-cleanup-workflow.mjs; self-contained for the static Pages repo.
name: Clean old website assets
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cleanup-old-website-assets
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the new website and remove exact obsolete files
        id: cleanup
        shell: bash
        run: |
          python - <<'PY'
          """One-time cleanup of verified obsolete builds; never deletes by wildcard.
          
          The generated GitHub workflow embeds this source and the exact Git blob allowlist.
          All preflight checks finish before git rm is called. No credentials are needed in
          this script: checkout supplies the workflow's normal repository credentials.
          """
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          
          PATTERNS = [
              r'assets/index-[A-Za-z0-9_-]{8}\.(?:js|css)',
              r'assets/[^/]+-[A-Za-z0-9_-]{8}\.woff2',
              r'assets/fonts/(?:notosanssc|notoserifsc)-[a-f0-9]{10}\.woff2',
              r'assets/ursga-logo-[A-Za-z0-9_-]{8}\.png',
          ]
          
          
          class References(HTMLParser):
              def __init__(self, html):
                  super().__init__()
                  self.urls = []
                  self.data_url = None
                  self.feed(html)
          
              def handle_starttag(self, tag, attributes):
                  attributes = dict(attributes)
                  for name in ['src', 'href']:
                      if attributes.get(name):
                          self.urls.append(attributes[name])
                  if tag == 'meta' and attributes.get('name') == 'site-content':
                      self.data_url = attributes.get('content')
                      if self.data_url:
                          self.urls.append(self.data_url)
          
          
          def local_path(root, url, owner='index.html'):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme or parsed.netloc or url.startswith('#'):
                  return None
              relative = urllib.parse.unquote(parsed.path)
              # Root-relative URLs refer to the repository root; relative CSS URLs resolve
              # from the CSS directory, not from index.html.
              target = (root / relative.lstrip('/') if relative.startswith('/')
                        else (root / owner).parent / relative).resolve()
              if not target.is_relative_to(root) or target == root:
                  raise ValueError(f'Resource escapes the website root: {url}')
              if not target.is_file():
                  raise ValueError(f'Current website resource is missing: {url}')
              version = urllib.parse.parse_qs(parsed.query).get('v', [None])[0]
              if version and hashlib.sha256(target.read_bytes()).hexdigest()[:len(version)] != version:
                  raise ValueError(f'Current resource does not match its cache version: {url}')
              return target.relative_to(root).as_posix()
          
          
          def collect_plan(root, allowlist):
              root = Path(root).resolve()
              html = (root / 'index.html').read_text(encoding='utf-8')
              refs = References(html)
              if not refs.data_url or 'assets/app.js' not in html or 'assets/style.css' not in html:
                  raise ValueError('新版尚未上传完整：请先上传 upload-update 中的 8 个文件，再运行清理。')
              protected = set()
              for url in refs.urls:
                  relative = local_path(root, url)
                  if relative:
                      protected.add(relative)
              data_path = local_path(root, refs.data_url)
              content = json.loads((root / data_path).read_text(encoding='utf-8'))
              if content.get('schemaVersion') != 1 or not isinstance(content.get('publications'), list):
                  raise ValueError('New website data is incomplete; nothing will be removed.')
              css = (root / 'assets/style.css').read_text(encoding='utf-8')
              for match in re.finditer(r'''url\(\s*['"]?([^)'"\s]+)''', css):
                  relative = local_path(root, match.group(1), 'assets/style.css')
                  if relative:
                      protected.add(relative)
              versions = content.get('assetVersions')
              if not isinstance(versions, dict) or not versions:
                  raise ValueError('Missing image/animation manifest; nothing will be removed.')
              for relative, version in versions.items():
                  checked = local_path(root, f'{relative}?v={version}')
                  if checked is None:
                      raise ValueError(f'Expected local image/animation: {relative}')
                  protected.add(checked)
              for paper in content['publications']:
                  for name in ['image', 'thumbnail']:
                      checked = local_path(root, paper[name])
                      if checked not in protected:
                          raise ValueError(f'Figure missing from the current resource manifest: {checked}')
              candidates = []
              for relative, expected in sorted(allowlist.items()):
                  if not any(re.fullmatch(pattern, relative) for pattern in PATTERNS):
                      raise ValueError(f'Path is outside the obsolete build allowlist: {relative}')
                  if relative in protected:
                      continue
                  target = root / relative
                  if not target.exists():
                      continue
                  if target.is_symlink() or not target.resolve().is_relative_to(root / 'assets') or not target.is_file():
                      raise ValueError(f'Unexpected file type or location: {relative}')
                  data = target.read_bytes()
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if blob != expected:
                      raise ValueError(f'An old file was modified; nothing will be removed: {relative}')
                  candidates.append(relative)
              return candidates
          
          
          def check_live(site_url, fetch=None):
              def download(url):
                  request = urllib.request.Request(url, headers={'User-Agent': 'URSGA-cleanup-check', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return response.read()
              fetch = fetch or download
              probe = site_url + ('&' if '?' in site_url else '?') + urllib.parse.urlencode({'cleanup_check': os.environ.get('GITHUB_RUN_ID', 'preflight')})
              html = fetch(probe).decode('utf-8')
              refs = References(html)
              if not refs.data_url or 'assets/app.js' not in html or 'assets/style.css' not in html:
                  raise ValueError('网站仍在使用旧版本或部署未完成，未删除任何文件。请等新版上线后重新运行。')
              data_url = urllib.parse.urljoin(site_url, refs.data_url)
              if urllib.parse.urlsplit(data_url).netloc != urllib.parse.urlsplit(site_url).netloc:
                  raise ValueError('Unexpected data origin; nothing will be removed.')
              content = json.loads(fetch(data_url))
              if content.get('schemaVersion') != 1:
                  raise ValueError('The deployed website data is not ready; nothing will be removed.')
          
          
          def clean(root, allowlist, site_url, fetch=None):
              root = Path(root).resolve()
              candidates = collect_plan(root, allowlist)
              check_live(site_url, fetch)
              # Every candidate is a checked, regular file inside this checkout's assets
              # directory. git rm receives an argument list, with no shell interpolation.
              if candidates:
                  subprocess.run(['git', 'rm', '--', *candidates], cwd=root, check=True, stdout=subprocess.DEVNULL)
              return candidates
          
