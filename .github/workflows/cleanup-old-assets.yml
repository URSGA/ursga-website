      - name: Commit the cleanup
        if: steps.cleanup.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove verified obsolete website build files"
          git push origin HEAD:main
      - name: Request Pages refresh
        if: steps.cleanup.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
            echo "::warning::Cleanup was committed. Pages refresh was not accepted; the next normal website update will also refresh deployment."
          fi
