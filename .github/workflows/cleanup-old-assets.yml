          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## 清理完成\n\n已删除 {len(removed)} 个经过校验的旧构建文件。当前页面引用的程序、字体、图片、动画和数据均保留。\n')
